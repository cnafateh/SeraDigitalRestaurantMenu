services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${SERA_DATABASE_URL:?Set SERA_DATABASE_URL to your existing PostgreSQL connection string}
      SERA_ADMIN_PASSWORD: ${SERA_ADMIN_PASSWORD:?Set SERA_ADMIN_PASSWORD in .env}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - uploads:/app/uploads
      - protection_keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${SERA_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
  protection_keys:
