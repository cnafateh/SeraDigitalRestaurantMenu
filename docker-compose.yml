x-database-environment: &database-environment
  DB_HOST: ${DB_HOST:?Set DB_HOST to the PostgreSQL container name or network alias}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_USER: ${DB_USER:?Set DB_USER}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-environment
      SERA_ADMIN_PASSWORD: ${SERA_ADMIN_PASSWORD:?Set SERA_ADMIN_PASSWORD in .env}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    networks: [default, database]
    volumes:
      - uploads:/app/uploads
      - protection_keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${SERA_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
  protection_keys:

networks:
  database:
    external: true
    name: ${DB_NETWORK:?Set DB_NETWORK to the existing PostgreSQL network name}
